<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Cloud Downloader</title>
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
      <style type="text/tailwindcss">
    @theme {
      --color-clifford: #da373d;
    }
     </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-xl border border-slate-700">
        <h1 class="text-3xl font-bold text-center mb-6 text-blue-400">Media Downloader</h1>
        
        <div class="space-y-4">
            <input type="text" id="urlInput" placeholder="Paste video link here..." class="w-full p-4 rounded-lg bg-slate-700 border border-slate-600 focus:outline-none focus:border-blue-500">
            
            <div class="flex gap-4">
                <button onclick="processDownload('tunnel')" id="videoBtn" class="w-1/2 bg-blue-600 hover:bg-blue-500 font-semibold p-4 rounded-lg transition">Download Video</button>
                <button onclick="processDownload('audio')" id="audioBtn" class="w-1/2 bg-emerald-600 hover:bg-emerald-500 font-semibold p-4 rounded-lg transition">Download MP3</button>
            </div>
        </div>

        <!-- Processing Status Box -->
        <div id="statusContainer" class="mt-6 hidden p-4 rounded-lg bg-slate-700/50 border border-slate-600 text-center animate-pulse">
            <p id="statusText" class="text-sm font-medium text-slate-300"></p>
        </div>
    </div>

    <script>
        async function processDownload(mode) {
            const inputUrl = document.getElementById('urlInput').value.trim();
            const videoBtn = document.getElementById('videoBtn');
            const audioBtn = document.getElementById('audioBtn');
            const statusContainer = document.getElementById('statusContainer');
            const statusText = document.getElementById('statusText');

            if (!inputUrl) return alert('Please paste a valid video URL first!');

            videoBtn.disabled = true;
            audioBtn.disabled = true;
            statusContainer.classList.remove('hidden');
            statusText.innerText = "Processing media stream parameters via open API cluster...";

            try {
                // THE CRUCIAL ADJUSTMENT: Points to the open backend processing cluster endpoint
                const targetApi = "https://api.cobalt.tools/";
                
                const response = await fetch(targetApi, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        url: inputUrl,
                        videoQuality: '720', 
                        downloadMode: mode,   
                        audioFormat: 'mp3'
                    })
                });

                if (!response.ok) {
                    throw new Error(`The central download infrastructure returned an unexpected server code: ${response.status}`);
                }

                const data = await response.json();

                if (data.status === 'error') {
                    throw new Error(data.text || 'The infrastructure cluster rejected processing this media link.');
                }

                if (data.url) {
                    statusText.innerText = "Download link ready! Transferring file...";
                    
                    // Create an ephemeral hidden layout anchor tab element to bypass tracking parameters 
                    const downloadLink = document.createElement('a');
                    downloadLink.href = data.url;
                    downloadLink.target = '_blank';
                    downloadLink.rel = 'noopener noreferrer';
                    document.body.appendChild(downloadLink);
                    downloadLink.click();
                    document.body.removeChild(downloadLink);
                } else {
                    throw new Error('Valid processing payload generated but media link container was empty.');
                }

            } catch (err) {
                console.error(err);
                alert('Downloader Update: ' + err.message + '\n\nTip: The public cluster may experience occasional load blocks. Try resubmitting in a few moments.');
            } finally {
                videoBtn.disabled = false;
                audioBtn.disabled = false;
                statusContainer.classList.add('hidden');
            }
        }
    </script>


</body>
</html>
